name: build-android-no-openmp
on:
  workflow_dispatch:
  push:
    tags:
      - '*'

env:
  COMMON_CMAKE_OPTIONS: |
    -DCMAKE_POLICY_DEFAULT_CMP0057=NEW \
    -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake \
    -DANDROID_USE_LEGACY_TOOLCHAIN_FILE=False \
    -DANDROID_PLATFORM=android-21 \
    -DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON \
    -DANDROID_CPP_FEATURES="no-rtti no-exceptions" \
    -DCMAKE_INSTALL_PREFIX=install \
    -DCMAKE_BUILD_TYPE=Release

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: ndk-fix-debug
      run: sed -i -e '/^  -g$/d' $ANDROID_NDK_LATEST_HOME/build/cmake/android-legacy.toolchain.cmake
    - name: download-opencv4-source
      run: |
        set -e  # 任何错误立即退出
        wget -q https://github.com/opencv/opencv/archive/4.13.0.zip -O opencv-4.13.0.zip
        unzip -q opencv-4.13.0.zip
        rm opencv-4.13.0.zip
        cd opencv-4.13.0
        echo "Current directory: $(pwd)"
        ls -la CMakeLists.txt
        truncate -s 0 cmake/OpenCVFindLibsGrfmt.cmake
        rm -rf modules/gapi
        truncate -s 0 cmake/platforms/OpenCV-Linux.cmake

        rm modules/core/src/cuda_*
        rm modules/core/src/direct*
        rm modules/core/src/gl_*
        rm modules/core/src/intel_gpu_*
        rm modules/core/src/ocl*
        rm modules/core/src/opengl.cpp
        rm modules/core/src/ovx.cpp
        rm modules/core/src/umatrix.hpp
        rm modules/core/src/va_intel.cpp
        rm modules/core/src/va_wrapper.impl.hpp

        rm modules/core/include/opencv2/core/cuda*.hpp
        rm modules/core/include/opencv2/core/directx.hpp
        rm modules/core/include/opencv2/core/ocl*.hpp
        rm modules/core/include/opencv2/core/opengl.hpp
        rm modules/core/include/opencv2/core/ovx.hpp
        rm modules/core/include/opencv2/core/private.cuda.hpp
        rm modules/core/include/opencv2/core/va_*.hpp
        rm -rf modules/core/include/opencv2/core/cuda
        rm -rf modules/core/include/opencv2/core/opencl
        rm -rf modules/core/include/opencv2/core/openvx

        rm modules/photo/src/denoising.cuda.cpp
        rm modules/photo/include/opencv2/photo/cuda.hpp

        find modules -type d | xargs -i rm -rf {}/src/cuda
        find modules -type d | xargs -i rm -rf {}/src/opencl
        find modules -type d | xargs -i rm -rf {}/perf/cuda
        find modules -type d | xargs -i rm -rf {}/perf/opencl
        find modules -type f | xargs -i sed -i '/opencl_kernels/d' {}
        find modules -type f | xargs -i sed -i '/cuda.hpp/d' {}
        find modules -type f | xargs -i sed -i '/opengl.hpp/d' {}
        find modules -type f | xargs -i sed -i '/ocl_defs.hpp/d' {}
        find modules -type f | xargs -i sed -i '/ocl.hpp/d' {}
        find modules -type f | xargs -i sed -i '/ovx_defs.hpp/d' {}
        find modules -type f | xargs -i sed -i '/ovx.hpp/d' {}
        find modules -type f | xargs -i sed -i '/va_intel.hpp/d' {}

        patch -p1 -i ../patches/opencv-4.13.0-no-gpu.patch
        patch -p1 -i ../patches/opencv-4.13.0-no-rtti.patch
        patch -p1 -i ../patches/opencv-4.13.0-no-zlib.patch
        # 不应用 link-openmp.patch - 禁用 OpenMP
        patch -p1 -i ../patches/opencv-4.13.0-fix-windows-arm-arch.patch
        patch -p1 -i ../patches/opencv-4.13.0-minimal-install.patch
        patch -p1 -i ../patches/opencv-4.13.0-no-atomic.patch
        patch -p1 -i ../patches/opencv-4.13.0-unsafe-xadd.patch
        cp ../patches/draw_text.h ../patches/mono_font_data.h modules/imgproc/src/
        cp ../patches/fontface.html ./
        patch -p1 -i ../patches/opencv-4.13.0-drawing-mono-font.patch
        rm -rf modules/highgui
        cp -r ../highgui modules/
        rm -rf 3rdparty
        rm -rf apps data doc samples platforms
        rm -rf modules/java
        rm -rf modules/js
        rm -rf modules/python
        rm -rf modules/ts
        rm -rf modules/dnn
        sed -e 's/__VERSION__/4.13.0/g' ../patches/Info.plist > ./Info.plist
        cp ../opencv4_cmake_options_no_openmp.txt ./options.txt
        cd ..
        mv opencv-4.13.0 opencv-mobile-4.13.0-no-openmp

    - name: verify-source
      run: |
        echo "=== Verifying source directory ==="
        ls -la opencv-mobile-4.13.0-no-openmp/
        echo ""
        echo "=== Checking CMakeLists.txt ==="
        ls -la opencv-mobile-4.13.0-no-openmp/CMakeLists.txt
        echo ""
        echo "=== Checking options.txt ==="
        ls -la opencv-mobile-4.13.0-no-openmp/options.txt
        echo ""
        echo "=== First few lines of CMakeLists.txt ==="
        head -5 opencv-mobile-4.13.0-no-openmp/CMakeLists.txt

    - name: build-armeabi-v7a
      run: |
        cd opencv-mobile-4.13.0-no-openmp
        mkdir build-armeabi-v7a && cd build-armeabi-v7a
        cmake ${{ env.COMMON_CMAKE_OPTIONS }} -DANDROID_ABI="armeabi-v7a" -DANDROID_ARM_NEON=ON \
            `cat ../options.txt` -DBUILD_opencv_world=OFF -DOPENCV_DISABLE_FILESYSTEM_SUPPORT=ON ..
        cmake --build . -j $(nproc)
        cmake --build . --target install

    - name: build-arm64-v8a
      run: |
        cd opencv-mobile-4.13.0-no-openmp
        mkdir build-arm64-v8a && cd build-arm64-v8a
        cmake ${{ env.COMMON_CMAKE_OPTIONS }} -DANDROID_ABI="arm64-v8a" \
            `cat ../options.txt` -DBUILD_opencv_world=OFF -DOPENCV_DISABLE_FILESYSTEM_SUPPORT=ON -DOPENCV_EXTRA_FLAGS="-mno-outline-atomics" ..
        cmake --build . -j $(nproc)
        cmake --build . --target install

    - name: build-x86
      run: |
        cd opencv-mobile-4.13.0-no-openmp
        mkdir build-x86 && cd build-x86
        cmake ${{ env.COMMON_CMAKE_OPTIONS }} -DANDROID_ABI="x86" \
            `cat ../options.txt` -DBUILD_opencv_world=OFF -DOPENCV_DISABLE_FILESYSTEM_SUPPORT=ON ..
        cmake --build . -j $(nproc)
        cmake --build . --target install

    - name: build-x86_64
      run: |
        cd opencv-mobile-4.13.0-no-openmp
        mkdir build-x86_64 && cd build-x86_64
        cmake ${{ env.COMMON_CMAKE_OPTIONS }} -DANDROID_ABI="x86_64" \
            `cat ../options.txt` -DBUILD_opencv_world=OFF -DOPENCV_DISABLE_FILESYSTEM_SUPPORT=ON ..
        cmake --build . -j $(nproc)
        cmake --build . --target install

    - name: package
      run: |
        mkdir opencv-mobile-4.13.0-no-openmp-android
        cp -rf opencv-mobile-4.13.0-no-openmp/build-x86/install/* opencv-mobile-4.13.0-no-openmp-android/
        cp -rf opencv-mobile-4.13.0-no-openmp/build-x86_64/install/* opencv-mobile-4.13.0-no-openmp-android/
        cp -rf opencv-mobile-4.13.0-no-openmp/build-armeabi-v7a/install/* opencv-mobile-4.13.0-no-openmp-android/
        cp -rf opencv-mobile-4.13.0-no-openmp/build-arm64-v8a/install/* opencv-mobile-4.13.0-no-openmp-android/
        zip -9 -r opencv-mobile-4.13.0-no-openmp-android.zip opencv-mobile-4.13.0-no-openmp-android

    - name: upload
      uses: actions/upload-artifact@v6
      with:
        name: opencv-mobile-4.13.0-no-openmp-android
        path: opencv-mobile-4.13.0-no-openmp-android.zip
